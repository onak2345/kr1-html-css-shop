<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — Учебный магазин</title>
  <meta name="description" content="Форма заявки на товар учебного интернет-магазина.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к основному содержимому</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">Учебный магазин</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
        <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
        <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html" aria-current="page">Заявка</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="main">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <ol class="breadcrumbs__list">
        <li class="breadcrumbs__item"><a class="breadcrumbs__link" href="index.html">Главная</a></li>
        <li class="breadcrumbs__item" aria-current="page">Заявка</li>
      </ol>
    </nav>
    <h1>Заявка на товар</h1>
    <p class="form-note">Поля, отмеченные звёздочкой, обязательны для заполнения.</p>
    <form class="order-form" action="#" method="post">
      <div class="order-form__group">
        <label class="order-form__label" for="order-name">Имя *</label>
        <input class="order-form__input" id="order-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="order-form__group">
        <label class="order-form__label" for="order-email">E-mail *</label>
        <input class="order-form__input" id="order-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="order-form__group">
        <label class="order-form__label" for="order-phone">Телефон</label>
        <input class="order-form__input" id="order-phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00">
      </div>
      <div class="order-form__group">
        <label class="order-form__label" for="order-date">Желаемая дата</label>
        <input class="order-form__input" id="order-date" name="date" type="date">
      </div>
      <div class="order-form__group order-form__group--wide">
        <label class="order-form__label" for="order-product">Товар</label>
        <select class="order-form__select" id="order-product" name="product">
          <option>Кофемашина Barista Home</option>
          <option>Блендер PowerMix 900</option>
          <option>Чайник Smart Kettle</option>
          <option>Тостер Crispy Two</option>
          <option>Миксер Whisk Pro</option>
          <option>Мультиварка Cook Easy</option>
        </select>
      </div>
      <div class="order-form__group order-form__group--wide">
        <label class="order-form__label" for="order-comment">Комментарий</label>
        <textarea class="order-form__textarea" id="order-comment" name="comment"></textarea>
      </div>
      <div class="order-form__group order-form__group--wide order-form__group--check">
        <input id="order-agree" name="agree" type="checkbox" required>
        <label for="order-agree">Согласен на обработку персональных данных *</label>
      </div>
      <p class="order-form__status order-form__group--wide" role="status"></p>
      <div class="order-form__group order-form__group--wide">
        <button class="button" type="submit">Отправить заявку</button>
      </div>
    </form>
  </main>
  <footer class="site-footer">
    <nav class="footer-nav" aria-label="Разделы главной страницы">
      <ul class="footer-nav__list">
        <li><a class="footer-nav__link" href="index.html#advantages">Преимущества</a></li>
        <li><a class="footer-nav__link" href="index.html#popular">Популярные товары</a></li>
      </ul>
    </nav>
    <p class="site-footer__text">&copy; 2026 Учебный проект. Комаров Никита К., ЭФБО-10-25</p>
  </footer>
  <button class="back-to-top" type="button" aria-label="Наверх" hidden><span aria-hidden="true">↑</span></button>
</body>
</html>
